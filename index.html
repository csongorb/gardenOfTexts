<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Garden of Texts</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<link rel="stylesheet" href="css/style.css">
	<script src="libraries/p5.min.js"></script>
	<script src="js/config.js"></script>
	<script src="js/helpers.js"></script>
	<script src="js/textLayout.js"></script>
	<script src="js/CharPlant.js"></script>
	<script src="js/Lineage.js"></script>
	<script src="js/Garden.js"></script>
	<script src="js/interaction.js"></script>
	<script src="js/sketch.js"></script>
</head>

<body>
	<div id="debug">
		<div id="debug-stats"></div><br>
		<label><input type="checkbox" data-layer="plants"> plants</label><br>
		<label><input type="checkbox" data-layer="bases"> plant bases</label><br>
		<label><input type="checkbox" data-layer="origins"> lineage origins</label><br>
		<label><input type="checkbox" data-layer="areas"> lineage areas</label><br>
		<label><input type="checkbox" data-layer="middles"> area middles</label><br>
		<label><input type="checkbox" data-layer="lineY"> average line y</label><br>
		<label><input type="checkbox" data-layer="alignedY"> aligned middles (y)</label><br>
		<label><input type="checkbox" data-layer="spreadRange"> spread range (hover)</label><br>
		<br>
		D: debug off<br>
		hold G: faster simulation
	</div>
	<div id="tools" class="ui left">
		<span data-mode="water">water</span> / <span data-mode="cut">cut</span>
	</div>
	<a id="about" class="ui right" href="https://github.com/csongorb/gardenOfTexts" target="_blank" rel="noopener">github / instructions / credits</a>
</body>

</html>
